<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Il nostro atlante — mappa dei viaggi</title>

<!-- ==========================================================
     INSTALLAZIONE SUL TELEFONO (PWA)
     Il manifest descrive l'app al sistema operativo: nome,
     icona, colori. I meta 'apple-' servono a iOS, che il
     manifest lo legge solo in parte.
     ========================================================== -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1f5731">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atlante">
<link rel="apple-touch-icon" href="./icona-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icona-192.png">

<!-- Leaflet: libreria per la mappa interattiva -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>
  /* ==========================================================
     PALETTE E VARIABILI
     verde  = luoghi visitati / paesi colorati
     ambra  = luoghi da visitare (desideri)
     ========================================================== */
  :root {
    --verde: #2e7d46;
    --verde-scuro: #1f5731;
    --ambra: #d97b1f;
    --ambra-scuro: #a85c12;
    --inchiostro: #24312a;
    --carta: #ffffff;
    --grigio: #6b746f;
    --bordo: #e3e6e4;
    --ombra: 0 4px 18px rgba(20, 35, 25, 0.18);
    --raggio: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: var(--inchiostro);
  }

  /* La mappa occupa tutto lo schermo, il resto galleggia sopra */
  #mappa { position: fixed; inset: 0; z-index: 1; }

  /* ==========================================================
     SCHERMATA DI ACCESSO
     Copre tutto finché non si è autenticati
     ========================================================== */
  #accesso {
    position: fixed;
    inset: 0;
    z-index: 4000;
    background: linear-gradient(160deg, #1f5731, #24312a);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #accesso.nascosto { display: none; }

  #riquadro-accesso {
    background: var(--carta);
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,.3);
    padding: 26px 22px calc(22px + env(safe-area-inset-bottom));
    width: 100%;
    max-width: 380px;
  }
  #riquadro-accesso h1 {
    margin: 0 0 4px;
    font-size: 20px;
  }
  #riquadro-accesso p.sottotitolo {
    margin: 0 0 20px;
    font-size: 13px;
    color: var(--grigio);
  }
  #bottone-entra {
    width: 100%;
    border: none;
    border-radius: var(--raggio);
    background: var(--inchiostro);
    color: #fff;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }
  #bottone-entra:disabled { opacity: .55; cursor: default; }
  #errore-accesso {
    display: none;
    margin-top: 12px;
    font-size: 13px;
    color: #b3392c;
    background: #fbe9e7;
    border-radius: 10px;
    padding: 10px 12px;
  }

  /* ==========================================================
     BARRA SUPERIORE: ricerca + contatori + utente
     ========================================================== */
  #barra-alta {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    left: 10px;
    right: 10px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 440px;
    margin: 0 auto;
  }

  #casella-ricerca {
    display: flex;
    align-items: center;
    background: var(--carta);
    border-radius: 999px;
    box-shadow: var(--ombra);
    padding: 4px 6px 4px 16px;
  }
  #campo-ricerca {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16px;       /* 16px evita lo zoom automatico su iOS */
    background: transparent;
    min-width: 0;
  }
  #bottone-ricerca {
    border: none;
    background: var(--inchiostro);
    color: #fff;
    border-radius: 999px;
    width: 38px;
    height: 38px;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* Risultati della ricerca, sotto la casella */
  #risultati-ricerca {
    background: var(--carta);
    border-radius: var(--raggio);
    box-shadow: var(--ombra);
    overflow: hidden;
    display: none;
  }
  #risultati-ricerca button {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    background: none;
    padding: 12px 16px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--bordo);
  }
  #risultati-ricerca button:last-child { border-bottom: none; }
  #risultati-ricerca button:hover { background: #f4f6f5; }

  /* Riga con contatori e nome di chi è collegato */
  #riga-stato {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .chip {
    background: var(--carta);
    border-radius: 999px;
    box-shadow: var(--ombra);
    padding: 6px 14px;
    font-size: 13px;
    color: var(--grigio);
  }
  #contatori strong { color: var(--verde-scuro); }
  #chip-utente {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 6px 4px 14px;
  }
  #nome-utente { font-weight: 600; color: var(--inchiostro); }
  #bottone-esci {
    border: none;
    background: #eef0ef;
    color: var(--inchiostro);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  /* Pallino che segnala la connessione al database */
  #spia-rete {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--verde);
    display: inline-block;
    margin-right: 2px;
  }
  #spia-rete.offline { background: var(--ambra); }

  /* ==========================================================
     PULSANTI IN BASSO: legenda + backup
     ========================================================== */
  #barra-bassa {
    position: fixed;
    bottom: max(14px, env(safe-area-inset-bottom));
    left: 10px;
    right: 10px;
    z-index: 1000;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 8px;
    max-width: 440px;
    margin: 0 auto;
    pointer-events: none; /* i figli riattivano i click */
  }
  #barra-bassa > * { pointer-events: auto; }

  #legenda {
    background: var(--carta);
    border-radius: var(--raggio);
    box-shadow: var(--ombra);
    padding: 10px 14px;
    font-size: 13px;
    line-height: 1.7;
  }
  .pallino {
    display: inline-block;
    width: 11px; height: 11px;
    border-radius: 50%;
    margin-right: 6px;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,.15);
    vertical-align: -1px;
  }
  .pallino.visitato { background: var(--verde); }
  .pallino.desiderio { background: var(--ambra); }

  #bottoni-backup { display: flex; flex-direction: column; gap: 8px; }
  .bottone-tondo {
    border: none;
    background: var(--carta);
    color: var(--inchiostro);
    border-radius: 999px;
    box-shadow: var(--ombra);
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .bottone-tondo:hover { background: #f4f6f5; }

  /* ==========================================================
     PANNELLO INSERIMENTO/MODIFICA (bottom sheet)
     ========================================================== */
  #velo {
    position: fixed; inset: 0;
    background: rgba(15, 25, 18, 0.35);
    z-index: 1500;
    display: none;
  }
  #pannello {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 2000;
    background: var(--carta);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -6px 30px rgba(20,35,25,.25);
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    max-width: 520px;
    margin: 0 auto;
    max-height: 82vh;
    overflow-y: auto;
    display: none;
  }
  #pannello h2 {
    margin: 0 0 4px;
    font-size: 18px;
  }
  #coordinate-pannello {
    font-size: 12px;
    color: var(--grigio);
    margin-bottom: 12px;
  }

  /* Selettore della categoria: due grandi bottoni radio */
  #scelta-stato { display: flex; gap: 8px; margin-bottom: 14px; }
  #scelta-stato label {
    flex: 1;
    text-align: center;
    padding: 10px 6px;
    border: 2px solid var(--bordo);
    border-radius: var(--raggio);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: var(--grigio);
  }
  #scelta-stato input { display: none; }
  #scelta-stato label:has(#stato-visitato:checked) {
    border-color: var(--verde);
    color: var(--verde-scuro);
    background: #eef7f0;
  }
  #scelta-stato label:has(#stato-desiderio:checked) {
    border-color: var(--ambra);
    color: var(--ambra-scuro);
    background: #fdf3e7;
  }

  .campo { margin-bottom: 12px; }
  .campo label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--grigio);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .campo input, .campo textarea {
    width: 100%;
    border: 1.5px solid var(--bordo);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 16px;
    font-family: inherit;
    outline: none;
  }
  .campo input:focus, .campo textarea:focus { border-color: var(--verde); }
  .campo textarea { resize: vertical; min-height: 70px; }

  /* Riga in fondo al pannello con la storia del luogo */
  #firma-pannello {
    font-size: 12px;
    color: var(--grigio);
    margin-top: 4px;
  }

  #azioni-pannello { display: flex; gap: 8px; margin-top: 16px; }
  #azioni-pannello button {
    flex: 1;
    border: none;
    border-radius: var(--raggio);
    padding: 13px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  #bottone-salva { background: var(--inchiostro); color: #fff; }
  #bottone-annulla { background: #eef0ef; color: var(--inchiostro); }

  /* ==========================================================
     POPUP DEI MARKER
     ========================================================== */
  .popup-luogo { font-size: 14px; min-width: 190px; }
  .popup-luogo h3 { margin: 0 0 2px; font-size: 16px; }
  .popup-luogo .sotto { color: var(--grigio); font-size: 12px; margin-bottom: 6px; }
  .popup-luogo .note { white-space: pre-wrap; margin: 6px 0; }
  .popup-luogo .firma {
    color: var(--grigio);
    font-size: 11px;
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid var(--bordo);
  }
  .popup-luogo a { color: var(--verde-scuro); word-break: break-all; }
  .popup-azioni { display: flex; gap: 6px; margin-top: 10px; }
  .popup-azioni button {
    flex: 1;
    border: none;
    border-radius: 8px;
    padding: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .popup-azioni .modifica { background: #eef0ef; }
  .popup-azioni .elimina { background: #fbe9e7; color: #b3392c; }

  /* ==========================================================
     TOAST: brevi messaggi di conferma
     ========================================================== */
  #toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--inchiostro);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    z-index: 3000;
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
  }
  #toast.visibile { opacity: 1; }

  /* ==========================================================
     AVVISO DI NUOVA VERSIONE
     Compare quando il service worker ha scaricato un
     aggiornamento: resta finché non si ricarica
     ========================================================== */
  #avviso-aggiornamento {
    position: fixed;
    left: 10px; right: 10px;
    bottom: max(14px, env(safe-area-inset-bottom));
    z-index: 3500;
    max-width: 440px;
    margin: 0 auto;
    background: var(--inchiostro);
    color: #fff;
    border-radius: var(--raggio);
    box-shadow: var(--ombra);
    padding: 12px 12px 12px 16px;
    display: none;
    align-items: center;
    gap: 12px;
    font-size: 14px;
  }
  #avviso-aggiornamento.visibile { display: flex; }
  #avviso-aggiornamento button {
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
  }
  #bottone-ricarica { background: var(--verde); color: #fff; }
  #bottone-rimanda { background: transparent; color: #b9c2bc; padding: 8px 4px; }

  /* Su schermi larghi le barre restano compatte a sinistra */
  @media (min-width: 700px) {
    #barra-alta, #barra-bassa { left: 20px; right: auto; width: 380px; }
  }
</style>
</head>

<!-- ============================================================
     REGISTRAZIONE DEL SERVICE WORKER
     ------------------------------------------------------------
     Script separato e ordinario (non un modulo): riguarda
     l'installazione dell'app, non la mappa, e deve poter
     funzionare anche se il resto fallisse.
     ============================================================ -->
<script>
(function registraServiceWorker() {
  if (!("serviceWorker" in navigator)) return;   // browser troppo vecchio: l'app funziona lo stesso

  window.addEventListener("load", async () => {
    try {
      const registrazione = await navigator.serviceWorker.register("./sw.js");

      // Quando il service worker trova una versione nuova, la scarica
      // in silenzio e avvisa. Non si ricarica da soli: l'utente
      // potrebbe avere il pannello aperto a metà compilazione.
      registrazione.addEventListener("updatefound", () => {
        const nuovo = registrazione.installing;
        if (!nuovo) return;
        nuovo.addEventListener("statechange", () => {
          // 'installed' con un controller già attivo = aggiornamento,
          // non prima installazione
          if (nuovo.state === "installed" && navigator.serviceWorker.controller) {
            document.getElementById("avviso-aggiornamento").classList.add("visibile");
          }
        });
      });

      // Controlla la presenza di aggiornamenti a ogni ritorno sull'app
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") registrazione.update();
      });
    } catch (e) {
      console.error("Service worker non registrato:", e);
    }
  });

  document.getElementById("bottone-ricarica")
    .addEventListener("click", () => location.reload());
  document.getElementById("bottone-rimanda")
    .addEventListener("click", () =>
      document.getElementById("avviso-aggiornamento").classList.remove("visibile"));
})();
</script>

// Mostra un breve messaggio in basso
let timerToast = null;
function toast(messaggio) {
  const el = document.getElementById("toast");
  el.textContent = messaggio;
  el.classList.add("visibile");
  clearTimeout(timerToast);
  timerToast = setTimeout(() => el.classList.remove("visibile"), 2600);
}

// Data ISO (aaaa-mm-gg) -> formato italiano leggibile
function formattaData(iso) {
  if (!iso) return "";
  const [a, m, g] = iso.split("-");
  return `${g}/${m}/${a}`;
}

// Nome leggibile a partire dall'identificativo dell'utente
function nomeDi(uid) {
  if (!uid) return "";
  return NOMI_UTENTI[uid] || "un altro utente";
}

/* Un istante salvato può presentarsi in tre forme:
   - Timestamp di Firestore (dato confermato dal server)
   - null (scrittura appena fatta, non ancora confermata)
   - stringa ISO (dato arrivato da un backup importato)
   Questa funzione le riporta tutte a una data leggibile. */
function formattaIstante(valore) {
  if (!valore) return "";
  let data;
  if (typeof valore.toDate === "function") data = valore.toDate();
  else data = new Date(valore);
  if (isNaN(data)) return "";
  return data.toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit", year: "numeric" });
}

/* ============================================================
   GEOCODING (Nominatim / OpenStreetMap)
   ============================================================ */

// Dato un punto, ricava città, paese e codice paese
async function geocodificaInversa(lat, lng) {
  try {
    const url = `${URL_NOMINATIM}/reverse?format=jsonv2&lat=${lat}&lon=${lng}` +
                `&zoom=10&addressdetails=1&accept-language=it`;
    const risposta = await fetch(url);
    if (!risposta.ok) throw new Error("HTTP " + risposta.status);
    const dati = await risposta.json();
    const a = dati.address || {};
    return {
      citta: a.city || a.town || a.village || a.municipality || a.county || "",
      paese: a.country || "",
      codicePaese: a.country_code || ""
    };
  } catch (e) {
    // Senza rete o servizio non raggiungibile: si compila a mano
    return { citta: "", paese: "", codicePaese: "" };
  }
}

// Ricerca per nome; restituisce al massimo 5 risultati
async function cercaLocalita(testo) {
  const url = `${URL_NOMINATIM}/search?format=jsonv2&limit=5&addressdetails=1` +
              `&accept-language=it&q=${encodeURIComponent(testo)}`;
  const risposta = await fetch(url);
  if (!risposta.ok) throw new Error("HTTP " + risposta.status);
  return risposta.json();
}

/* ============================================================
   MARKER E POPUP
   ============================================================ */

function coloreStato(stato) {
  return stato === "visitato" ? "#2e7d46" : "#d97b1f";
}

// Testo della firma: chi ha aggiunto il luogo e chi lo ha modificato
function testoFirma(luogo) {
  const pezzi = [];
  if (luogo.creatoDa) {
    const quando = formattaIstante(luogo.creatoIl);
    pezzi.push(`Aggiunto da ${nomeDi(luogo.creatoDa)}${quando ? " il " + quando : ""}`);
  }
  if (luogo.modificatoDa) {
    const quando = formattaIstante(luogo.modificatoIl);
    pezzi.push(`modificato da ${nomeDi(luogo.modificatoDa)}${quando ? " il " + quando : ""}`);
  }
  return pezzi.join(" · ");
}

// Crea il marker di un luogo con il suo popup
function creaMarker(luogo) {
  const marker = L.circleMarker([luogo.lat, luogo.lng], {
    radius: 9,
    fillColor: coloreStato(luogo.stato),
    fillOpacity: 1,
    color: "#ffffff",
    weight: 2.5
  });

  // Il popup viene costruito con elementi DOM (non stringhe HTML) così i
  // testi inseriti dagli utenti sono sempre mostrati come testo.
  // È una funzione: viene rieseguita a ogni apertura, quindi mostra
  // sempre i dati aggiornati anche dopo una modifica arrivata dall'altro.
  marker.bindPopup(() => {
    const box = document.createElement("div");
    box.className = "popup-luogo";

    const titolo = document.createElement("h3");
    titolo.textContent = luogo.citta || "Luogo senza nome";
    box.appendChild(titolo);

    const sotto = document.createElement("div");
    sotto.className = "sotto";
    const pezzi = [];
    if (luogo.paese) pezzi.push(luogo.paese);
    if (luogo.data) pezzi.push(formattaData(luogo.data));
    pezzi.push(luogo.stato === "visitato" ? "✓ visitato" : "★ da visitare");
    sotto.textContent = pezzi.join(" · ");
    box.appendChild(sotto);

    if (luogo.note) {
      const note = document.createElement("div");
      note.className = "note";
      note.textContent = luogo.note;
      box.appendChild(note);
    }

    if (luogo.link) {
      const link = document.createElement("a");
      link.href = luogo.link;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = "Apri link";
      box.appendChild(link);
    }

    const azioni = document.createElement("div");
    azioni.className = "popup-azioni";

    const btnModifica = document.createElement("button");
    btnModifica.className = "modifica";
    btnModifica.textContent = "Modifica";
    btnModifica.addEventListener("click", () => apriPannelloModifica(luogo.id));

    const btnElimina = document.createElement("button");
    btnElimina.className = "elimina";
    btnElimina.textContent = "Elimina";
    btnElimina.addEventListener("click", () => eliminaLuogo(luogo.id));

    azioni.appendChild(btnModifica);
    azioni.appendChild(btnElimina);
    box.appendChild(azioni);

    const firma = testoFirma(luogo);
    if (firma) {
      const riga = document.createElement("div");
      riga.className = "firma";
      riga.textContent = firma;
      box.appendChild(riga);
    }

    return box;
  });

  return marker;
}

/* ============================================================
   SINCRONIZZAZIONE IN TEMPO REALE
   ------------------------------------------------------------
   Un solo ascoltatore sulla raccolta. Ogni cambiamento, che
   arrivi da questo dispositivo o dall'altro, entra da qui.
   ============================================================ */

function avviaAscolto() {
  if (fermaAscolto) return;

  fermaAscolto = onSnapshot(raccoltaLuoghi,
    istantanea => {
      // La spia diventa ambra quando i dati mostrati non sono
      // ancora confermati dal server (tipicamente: siamo offline)
      const spia = document.getElementById("spia-rete");
      spia.classList.toggle("offline", istantanea.metadata.fromCache);

      for (const cambio of istantanea.docChanges()) {
        const dati = { id: cambio.doc.id, ...cambio.doc.data() };
        if (cambio.type === "removed") rimuoviInLocale(dati.id);
        else inserisciOAggiornaInLocale(dati);
      }

      aggiornaColoriPaesi();
      aggiornaContatori();
    },
    errore => {
      console.error("Ascolto interrotto:", errore);
      toast("Sincronizzazione interrotta: " + errore.code);
    }
  );
}

function chiudiAscolto() {
  if (fermaAscolto) { fermaAscolto(); fermaAscolto = null; }
}

// Allinea la copia locale e il marker corrispondente
function inserisciOAggiornaInLocale(dati) {
  const esistente = luoghi.find(l => l.id === dati.id);

  if (esistente) {
    // Si aggiorna l'oggetto esistente senza sostituirlo: il popup
    // del marker punta a questo oggetto e resta così sincronizzato
    Object.assign(esistente, dati);
    const marker = markerPerId.get(dati.id);
    if (marker) {
      marker.setLatLng([esistente.lat, esistente.lng]);
      marker.setStyle({ fillColor: coloreStato(esistente.stato) });
    }
  } else {
    luoghi.push(dati);
    const marker = creaMarker(dati);
    marker.addTo(gruppoMarker);
    markerPerId.set(dati.id, marker);
  }
}

function rimuoviInLocale(id) {
  luoghi = luoghi.filter(l => l.id !== id);
  const marker = markerPerId.get(id);
  if (marker) gruppoMarker.removeLayer(marker);
  markerPerId.delete(id);
}

// Svuota mappa e memoria (all'uscita dall'account)
function svuotaTutto() {
  luoghi = [];
  gruppoMarker.clearLayers();
  markerPerId.clear();
  aggiornaColoriPaesi();
}

/* ============================================================
   COLORAZIONE DEI PAESI VISITATI
   ============================================================ */

// Insieme dei codici ISO3 dei paesi con almeno un luogo visitato
function paesiVisitatiISO3() {
  const insieme = new Set();
  for (const luogo of luoghi) {
    if (luogo.stato === "visitato" && luogo.codicePaese) {
      const iso3 = ISO2_A_ISO3[luogo.codicePaese.toLowerCase()];
      if (iso3) insieme.add(iso3);
    }
  }
  return insieme;
}

// Scarica i confini e crea il layer (una sola volta)
async function caricaConfini() {
  if (livelloConfini) return;
  try {
    const risposta = await fetch(URL_CONFINI);
    if (!risposta.ok) throw new Error("HTTP " + risposta.status);
    const geojson = await risposta.json();

    livelloConfini = L.geoJSON(geojson, {
      interactive: false,          // i confini non catturano i click
      style: () => ({ fillOpacity: 0, opacity: 0 })
    }).addTo(mappa);

    livelloConfini.bringToBack(); // i marker restano sopra
    aggiornaColoriPaesi();
  } catch (e) {
    console.error("Confini non caricati:", e);
    toast("Confini paesi non disponibili (serve la connessione)");
  }
}

// Applica il colore ai paesi visitati, rende invisibili gli altri
function aggiornaColoriPaesi() {
  if (!livelloConfini) return;
  const visitati = paesiVisitatiISO3();
  livelloConfini.setStyle(feature => {
    const visitato = visitati.has(feature.id);
    return visitato
      ? { fillColor: "#2e7d46", fillOpacity: 0.22, color: "#2e7d46", opacity: 0.5, weight: 1 }
      : { fillOpacity: 0, opacity: 0 };
  });
}

/* ============================================================
   CONTATORI
   ============================================================ */

function aggiornaContatori() {
  const el = document.getElementById("contatori");
  const nPaesi = paesiVisitatiISO3().size;
  const nVisitati = luoghi.filter(l => l.stato === "visitato").length;
  const nDesideri = luoghi.length - nVisitati;
  el.innerHTML = `<strong>${nPaesi}</strong> paesi · ` +
                 `<strong>${nVisitati}</strong> visitati · ` +
                 `<strong>${nDesideri}</strong> da visitare`;
}

function mostraPannello(mostra) {
  document.getElementById("pannello").style.display = mostra ? "block" : "none";
  document.getElementById("velo").style.display = mostra ? "block" : "none";
}

function rimuoviMarkerProvvisorio() {
  if (markerProvvisorio) {
    mappa.removeLayer(markerProvvisorio);
    markerProvvisorio = null;
  }
}

// Apre il pannello per un NUOVO luogo nel punto toccato
async function apriPannelloNuovo(lat, lng) {
  bozza = { lat, lng, codicePaese: "", idInModifica: null };

  // Segnaposto grigio nel punto scelto
  rimuoviMarkerProvvisorio();
  markerProvvisorio = L.circleMarker([lat, lng], {
    radius: 9, fillColor: "#8a938e", fillOpacity: 1, color: "#fff", weight: 2.5
  }).addTo(mappa);

  document.getElementById("titolo-pannello").textContent = "Nuovo luogo";
  document.getElementById("coordinate-pannello").textContent =
    `${lat.toFixed(4)}, ${lng.toFixed(4)} — recupero città e paese…`;
  document.getElementById("stato-visitato").checked = true;
  document.getElementById("campo-citta").value = "";
  document.getElementById("campo-paese").value = "";
  document.getElementById("campo-data").value = "";
  document.getElementById("campo-note").value = "";
  document.getElementById("campo-link").value = "";
  document.getElementById("firma-pannello").textContent = "";
  mostraPannello(true);

  // Precompila città e paese con il reverse geocoding
  const info = await geocodificaInversa(lat, lng);
  // L'utente potrebbe aver già chiuso il pannello: in tal caso, stop
  if (!bozza || bozza.idInModifica !== null) return;
  bozza.codicePaese = info.codicePaese;
  if (info.citta && !document.getElementById("campo-citta").value) {
    document.getElementById("campo-citta").value = info.citta;
  }
  if (info.paese && !document.getElementById("campo-paese").value) {
    document.getElementById("campo-paese").value = info.paese;
  }
  document.getElementById("coordinate-pannello").textContent =
    `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
}

// Apre il pannello per MODIFICARE un luogo esistente
function apriPannelloModifica(id) {
  const luogo = luoghi.find(l => l.id === id);
  if (!luogo) return;

  bozza = { lat: luogo.lat, lng: luogo.lng, codicePaese: luogo.codicePaese, idInModifica: id };

  document.getElementById("titolo-pannello").textContent = "Modifica luogo";
  document.getElementById("coordinate-pannello").textContent =
    `${luogo.lat.toFixed(4)}, ${luogo.lng.toFixed(4)}`;
  document.getElementById(luogo.stato === "visitato" ? "stato-visitato" : "stato-desiderio").checked = true;
  document.getElementById("campo-citta").value = luogo.citta || "";
  document.getElementById("campo-paese").value = luogo.paese || "";
  document.getElementById("campo-data").value = luogo.data || "";
  document.getElementById("campo-note").value = luogo.note || "";
  document.getElementById("campo-link").value = luogo.link || "";
  document.getElementById("firma-pannello").textContent = testoFirma(luogo);

  mappa.closePopup();
  mostraPannello(true);
}

function chiudiPannello() {
  mostraPannello(false);
  rimuoviMarkerProvvisorio();
  bozza = null;
}

/* Salva il luogo (nuovo o modificato).
   Non si aspetta la conferma del server: con la cache offline
   attiva quella conferma può arrivare molto dopo, o solo al
   ritorno della connessione. Il marker compare comunque subito,
   perché l'ascoltatore reagisce già alla scrittura locale. */
function salvaLuogo() {
  if (!bozza || !utente) return;

  const stato = document.getElementById("stato-visitato").checked ? "visitato" : "desiderio";
  const dati = {
    citta: document.getElementById("campo-citta").value.trim(),
    paese: document.getElementById("campo-paese").value.trim(),
    data:  document.getElementById("campo-data").value,
    note:  document.getElementById("campo-note").value.trim(),
    link:  document.getElementById("campo-link").value.trim(),
    stato
  };

  let operazione;

  if (bozza.idInModifica) {
    // Modifica: si registra chi ha messo mano al luogo e quando
    operazione = updateDoc(doc(db, NOME_COLLEZIONE, bozza.idInModifica), {
      ...dati,
      modificatoDa: utente.uid,
      modificatoIl: serverTimestamp()
    });
  } else {
    // Nuovo luogo: si registra chi lo ha aggiunto
    operazione = addDoc(raccoltaLuoghi, {
      lat: bozza.lat,
      lng: bozza.lng,
      codicePaese: bozza.codicePaese || "",
      ...dati,
      creatoDa: utente.uid,
      creatoIl: serverTimestamp(),
      modificatoDa: null,
      modificatoIl: null
    });
  }

  operazione.catch(e => {
    console.error("Scrittura fallita:", e);
    toast("Salvataggio non riuscito: " + (e.code || e.message));
  });

  chiudiPannello();
  toast("Luogo salvato");
}

// Elimina un luogo dopo conferma
function eliminaLuogo(id) {
  const luogo = luoghi.find(l => l.id === id);
  if (!luogo) return;

  const nome = luogo.citta || "questo luogo";
  const avviso = luogo.creatoDa && luogo.creatoDa !== (utente && utente.uid)
    ? `\nÈ stato aggiunto da ${nomeDi(luogo.creatoDa)} e sparirà anche dalla sua mappa.`
    : "\nSparirà anche dall'altra mappa.";
  if (!confirm(`Eliminare "${nome}"?${avviso}`)) return;

  deleteDoc(doc(db, NOME_COLLEZIONE, id)).catch(e => {
    console.error("Eliminazione fallita:", e);
    toast("Eliminazione non riuscita: " + (e.code || e.message));
  });

  mappa.closePopup();
  toast("Luogo eliminato");
}

/* ============================================================
   RICERCA PER NOME
   ============================================================ */

function nascondiRisultati() {
  const box = document.getElementById("risultati-ricerca");
  box.style.display = "none";
  box.innerHTML = "";
}

async function eseguiRicerca() {
  const testo = document.getElementById("campo-ricerca").value.trim();
  if (!testo) return;

  const box = document.getElementById("risultati-ricerca");
  box.innerHTML = "";
  try {
    const risultati = await cercaLocalita(testo);
    if (!risultati.length) {
      toast("Nessun risultato per la ricerca");
      return;
    }
    for (const r of risultati) {
      const btn = document.createElement("button");
      btn.textContent = r.display_name;
      btn.addEventListener("click", () => {
        nascondiRisultati();
        document.getElementById("campo-ricerca").value = "";
        const lat = parseFloat(r.lat), lng = parseFloat(r.lon);
        mappa.flyTo([lat, lng], 9, { duration: 1.2 });
        // A fine volo, propone subito l'inserimento in quel punto
        mappa.once("moveend", () => apriPannelloNuovo(lat, lng));
      });
      box.appendChild(btn);
    }
    box.style.display = "block";
  } catch (e) {
    toast("Ricerca non riuscita: controlla la connessione");
  }
}

/* ============================================================
   BACKUP: ESPORTA E IMPORTA JSON
   ============================================================ */

function esportaBackup() {
  // Le date di sistema vengono convertite in testo leggibile da qualunque programma
  const luoghiEsportati = luoghi.map(l => ({
    ...l,
    creatoIl: l.creatoIl && l.creatoIl.toDate ? l.creatoIl.toDate().toISOString() : (l.creatoIl || null),
    modificatoIl: l.modificatoIl && l.modificatoIl.toDate ? l.modificatoIl.toDate().toISOString() : (l.modificatoIl || null)
  }));

  const contenuto = {
    app: "atlante-viaggi",
    versione: 2,
    esportato: new Date().toISOString(),
    luoghi: luoghiEsportati
  };
  const blob = new Blob([JSON.stringify(contenuto, null, 2)],
                        { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const oggi = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `atlante-viaggi-${oggi}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast("Backup esportato");
}

/* L'importazione sostituisce l'intero archivio CONDIVISO: cancella
   i luoghi presenti e scrive quelli del file. Si usa una scrittura
   in blocco (batch) così l'operazione riesce tutta o non riesce
   affatto, senza lasciare la mappa a metà. */
function importaBackup(file) {
  const lettore = new FileReader();
  lettore.onload = () => {
    try {
      const dati = JSON.parse(lettore.result);
      // Accetta sia il formato completo sia un semplice array di luoghi
      const elenco = Array.isArray(dati) ? dati : dati.luoghi;
      if (!Array.isArray(elenco)) throw new Error("formato non riconosciuto");

      // Controllo minimo su ogni voce
      const validi = elenco.filter(l =>
        l && typeof l.lat === "number" && typeof l.lng === "number");
      if (!validi.length) throw new Error("nessun luogo valido nel file");

      // Limite tecnico di una scrittura in blocco: 500 operazioni,
      // e qui ogni luogo vecchio da cancellare ne occupa una
      if (validi.length + luoghi.length > 480) {
        throw new Error("archivio troppo grande per un'unica importazione");
      }

      const msg = `Importare ${validi.length} luoghi?\n\n` +
                  `ATTENZIONE: i ${luoghi.length} luoghi attuali verranno ` +
                  `cancellati, sulla tua mappa e su quella di ${nomeAltroUtente()}.`;
      if (!confirm(msg)) return;

      const blocco = writeBatch(db);
      for (const vecchio of luoghi) {
        blocco.delete(doc(db, NOME_COLLEZIONE, vecchio.id));
      }
      for (const l of validi) {
        // L'id del file non viene riusato: se ne genera uno nuovo
        blocco.set(doc(raccoltaLuoghi), {
          lat: l.lat,
          lng: l.lng,
          stato: l.stato === "desiderio" ? "desiderio" : "visitato",
          citta: l.citta || "",
          paese: l.paese || "",
          codicePaese: l.codicePaese || "",
          data: l.data || "",
          note: l.note || "",
          link: l.link || "",
          // Se il backup conserva la paternità la si mantiene,
          // altrimenti il luogo risulta importato da chi sta operando
          creatoDa: l.creatoDa || utente.uid,
          creatoIl: l.creatoIl || null,
          modificatoDa: utente.uid,
          modificatoIl: serverTimestamp()
        });
      }

      blocco.commit()
        .then(() => toast(`Importati ${validi.length} luoghi`))
        .catch(e => {
          console.error("Importazione fallita:", e);
          toast("Importazione non riuscita: " + (e.code || e.message));
        });

    } catch (e) {
      toast("File non valido: " + e.message);
    }
  };
  lettore.readAsText(file);
}

// Nome dell'altra persona, per gli avvisi
function nomeAltroUtente() {
  const altri = Object.entries(NOMI_UTENTI)
    .filter(([uid]) => !utente || uid !== utente.uid)
    .map(([, nome]) => nome);
  return altri.length ? altri.join(" e ") : "l'altro utente";
}

/* ============================================================
   ACCESSO
   ============================================================ */

function mostraErroreAccesso(testo) {
  const el = document.getElementById("errore-accesso");
  el.textContent = testo;
  el.style.display = testo ? "block" : "none";
}

// Traduce i codici di errore di Firebase in messaggi comprensibili
function messaggioErrore(codice) {
  switch (codice) {
    case "auth/invalid-email":
      return "Indirizzo email non valido.";
    case "auth/invalid-credential":
    case "auth/wrong-password":
    case "auth/user-not-found":
      return "Email o password non corretti.";
    case "auth/too-many-requests":
      return "Troppi tentativi. Riprova tra qualche minuto.";
    case "auth/network-request-failed":
      return "Nessuna connessione: il primo accesso richiede la rete.";
    case "auth/unauthorized-domain":
      return "Questo indirizzo non è fra i domini autorizzati in Firebase.";
    default:
      return "Accesso non riuscito (" + codice + ").";
  }
}

async function entra() {
  const email = document.getElementById("campo-email").value.trim();
  const password = document.getElementById("campo-password").value;
  if (!email || !password) {
    mostraErroreAccesso("Servono email e password.");
    return;
  }

  const bottone = document.getElementById("bottone-entra");
  bottone.disabled = true;
  bottone.textContent = "Accesso in corso…";
  mostraErroreAccesso("");

  try {
    await signInWithEmailAndPassword(auth, email, password);
    // Il resto avviene in onAuthStateChanged
  } catch (e) {
    console.error("Accesso fallito:", e);
    mostraErroreAccesso(messaggioErrore(e.code));
  } finally {
    bottone.disabled = false;
    bottone.textContent = "Entra";
  }
}

async function esci() {
  if (!confirm("Uscire dall'account?")) return;
  chiudiAscolto();
  svuotaTutto();
  await signOut(auth);
}

function mostraAccesso(mostra) {
  document.getElementById("accesso").classList.toggle("nascosto", !mostra);
  if (mostra) document.getElementById("campo-password").value = "";
}

/* ============================================================
   AVVIO
   ============================================================ */

function preparaMappa() {
  // Mappa centrata sul mondo, con limiti per non "perderla" trascinando
  mappa = L.map("mappa", {
    center: [30, 10],
    zoom: 2,
    minZoom: 2,
    worldCopyJump: true,
    zoomControl: false
  });
  L.control.zoom({ position: "bottomright" }).addTo(mappa);

  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(mappa);

  gruppoMarker = L.layerGroup().addTo(mappa);

  // Tap/click sulla mappa = proposta di nuovo luogo
  mappa.on("click", e => {
    if (!utente) return;
    // Se il pannello è già aperto non si apre un secondo inserimento
    if (document.getElementById("pannello").style.display === "block") return;
    nascondiRisultati();
    apriPannelloNuovo(e.latlng.lat, e.latlng.lng);
  });
}

function collegaComandi() {
  // Accesso
  document.getElementById("bottone-entra").addEventListener("click", entra);
  document.getElementById("campo-password").addEventListener("keydown", e => {
    if (e.key === "Enter") entra();
  });
  document.getElementById("campo-email").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("campo-password").focus();
  });
  document.getElementById("bottone-esci").addEventListener("click", esci);

  // Pannello
  document.getElementById("bottone-salva").addEventListener("click", salvaLuogo);
  document.getElementById("bottone-annulla").addEventListener("click", chiudiPannello);
  document.getElementById("velo").addEventListener("click", chiudiPannello);

  // Ricerca
  document.getElementById("bottone-ricerca").addEventListener("click", eseguiRicerca);
  document.getElementById("campo-ricerca").addEventListener("keydown", e => {
    if (e.key === "Enter") eseguiRicerca();
  });

  // Backup
  document.getElementById("bottone-esporta").addEventListener("click", esportaBackup);
  document.getElementById("bottone-importa").addEventListener("click",
    () => document.getElementById("file-import").click());
  document.getElementById("file-import").addEventListener("change", e => {
    if (e.target.files.length) importaBackup(e.target.files[0]);
    e.target.value = ""; // permette di reimportare lo stesso file
  });
}

function avvia() {
  preparaMappa();
  collegaComandi();

  const app = initializeApp(CONFIG_FIREBASE);
  auth = getAuth(app);

  // La cache persistente permette di consultare e modificare la mappa
  // anche senza rete: le scritture partono al ritorno della connessione.
  // "multiple tab" evita conflitti se l'app è aperta in più schede.
  db = initializeFirestore(app, {
    localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
  });
  raccoltaLuoghi = collection(db, NOME_COLLEZIONE);

  // Unico punto in cui si decide se mostrare la mappa o l'accesso.
  // Viene richiamato anche all'avvio, recuperando la sessione salvata.
  onAuthStateChanged(auth, u => {
    utente = u;
    if (u) {
      document.getElementById("nome-utente").textContent = nomeDi(u.uid);
      mostraAccesso(false);
      avviaAscolto();
      caricaConfini();
      // Leaflet ha disegnato la mappa mentre era coperta: va ridimensionata
      setTimeout(() => mappa.invalidateSize(), 60);
    } else {
      chiudiAscolto();
      svuotaTutto();
      aggiornaContatori();
      mostraAccesso(true);
    }
  });
}

avvia();
</script>
